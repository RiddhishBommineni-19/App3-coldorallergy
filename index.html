<!DOCTYPE html>
<html>

<head>
  <title>Cold or Allergy</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="w3.css">
  <link rel="stylesheet" href="w3-colors-flat.css">

  <script>
    // counts
    var allergy_count = 0;
    var cold_count = 0;

    // add points
    function allergyAdd() {
      allergy_count = allergy_count + 1;
    }

    function coldAdd() {
      cold_count = cold_count + 1;
    }

    // show result
    function showResult() {
      if (allergy_count > cold_count) {
        document.getElementById("result").innerHTML = "More likely: ALLERGIES";
      }
      else if (cold_count > allergy_count) {
        document.getElementById("result").innerHTML = "More likely: COLD";
      }
      else {
        document.getElementById("result").innerHTML = "Could be either.";
      }
    }
  </script>

  <style>
    .page {
      position: fixed;
      left: -100vw;
      width: 100vw;
      height: 100vh;
    }

    .page:target {
      left: 0;
    }
  </style>
</head>

<body>

<!-- HOME -->
<div class="w3-container w3-flat-carrot">
  <h1>Cold or Allergy?</h1>
</div>

<div class="w3-container">
  <p>Answer a few questions to see if it is more likely a cold or allergies.</p>
  <a href="#q1" class="w3-btn w3-black">Start</a>
</div>

<!-- QUESTION 1 -->
<div class="page" id="q1">
  <div class="w3-container w3-flat-carrot">
    <h2>Are your eyes watery or itchy?</h2>
  </div>

  <div class="w3-container">
    <a href="#q2" onclick="allergyAdd()" class="w3-btn w3-black">Yes</a>
    <a href="#q2" onclick="coldAdd()" class="w3-btn w3-black">No</a>
  </div>
</div>

<!-- QUESTION 2 -->
<div class="page" id="q2">
  <div class="w3-container w3-flat-carrot">
    <h2>Do you have a fever?</h2>
  </div>

  <div class="w3-container">
    <a href="#q3" onclick="coldAdd()" class="w3-btn w3-black">Yes</a>
    <a href="#q3" onclick="allergyAdd()" class="w3-btn w3-black">No</a>
  </div>
</div>

<!-- QUESTION 3 -->
<div class="page" id="q3">
  <div class="w3-container w3-flat-carrot">
    <h2>Do you have a sore throat?</h2>
  </div>

  <div class="w3-container">
    <a href="#q4" onclick="coldAdd()" class="w3-btn w3-black">Yes</a>
    <a href="#q4" onclick="allergyAdd()" class="w3-btn w3-black">No</a>
  </div>
</div>

<!-- QUESTION 4 -->
<div class="page" id="q4">
  <div class="w3-container w3-flat-carrot">
    <h2>Are your symptoms seasonal?</h2>
  </div>

  <div class="w3-container">
    <a href="#resultPage" onclick="allergyAdd()" class="w3-btn w3-black">Yes</a>
    <a href="#resultPage" onclick="coldAdd()" class="w3-btn w3-black">No</a>
  </div>
</div>

<!-- RESULTS -->
<div class="page" id="resultPage">
  <div class="w3-container w3-flat-carrot">
    <h2>Result</h2>
  </div>

  <div class="w3-container">
    <p id="result"></p>
    <a href="#resultPage" onclick="showResult()" class="w3-btn w3-black">
      Show Result
    </a>
  </div>
</div>

</body>
</html>
